<!doctype html>
<html lang="en"><head><meta charset="utf-8"><script src="/guard.js"></script><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12304a"><title>Student feedback - RVNP</title><link rel="stylesheet" href="/portal-theme.css"><link rel="stylesheet" href="/shell.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f5;color:#17251d;font:16px/1.5 system-ui,Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:22px 16px 48px}header{margin:12px 0 22px}h1{margin:0;color:#176b43;font-size:28px}.lead{color:#53645a}.card{background:#fff;border:1px solid #dce6df;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 10px #173e2510}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}label{display:block;font-weight:650;margin:5px 0}input,select,textarea{width:100%;padding:11px;border:1px solid #cbd8cf;border-radius:8px;font:inherit;background:white;color:inherit}textarea{min-height:95px}button{border:0;border-radius:9px;padding:11px 17px;background:#176b43;color:white;font-weight:700;font:inherit;cursor:pointer}button:disabled{opacity:.55}.muted{color:#617067;font-size:14px}.msg{padding:10px;border-radius:8px;margin:10px 0}.err{background:#fff0ed;color:#922b1d}.ok{background:#e8f5ec;color:#176b43}.item{border-top:1px solid #e5ece7;padding:14px 0}.pill{display:inline-block;border-radius:30px;background:#edf3ee;padding:3px 10px;font-size:13px}.urgent{color:#a12b20;font-weight:700}@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{padding:14px}}
</style></head><body><main class="wrap"><header><div style="font-weight:800;color:#176b43">RVNP · INDUSTRIAL LINKAGES OFFICE</div><h1>Student feedback</h1><p class="lead">Review attachment feedback submitted by students in your authorised area.</p><a id="back" href="/auth.html?role=staff">Back to my dashboard</a></header><div id="app"><p>Loading your secure portal…</p></div></main>
<script>
(function(){'use strict';var app=document.getElementById('app'),token=sessionStorage.getItem('rvnp_admin')||RVGuard.token(['rep','hod','deputy']);if(!token){location.replace('/auth.html?role=staff');return}var ROLEPAGE=sessionStorage.getItem('rvnp_admin')?'/admin.html':({rep:'/ilo.html',hod:'/hod.html',deputy:'/deputy.html'})[RVGuard.info(token).role]||'/auth.html?role=staff';document.getElementById('back').href=ROLEPAGE;function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}async function api(path,opt){opt=opt||{};opt.headers=Object.assign({'Authorization':'Bearer '+token,'Content-Type':'application/json'},opt.headers||{});var r=await fetch('/api/'+path,opt),d=await r.json().catch(function(){return {error:'The server returned an invalid response.'}});if(!r.ok)throw Error(d.error||'Request failed');return d}function msg(t,kind){var e=document.getElementById('msg');if(e){e.className='msg '+kind;e.textContent=t}}
function status(s){return ({new:'New',in_progress:'In progress',resolved:'Resolved',referred:'Referred'})[s]||s}
async function start(){try{var d=await api('feedback');if(!d.canTriage)throw Error('This page is for ILO staff. Students open Attachment feedback from their own dashboard.');renderStaff(d.list||[])}catch(e){app.innerHTML='<div class="card msg err">'+esc(e.message)+'</div>'}}
function renderStudent(list){app.innerHTML='<section class="card"><h2>Submit attachment feedback</h2><p class="muted">Your feedback is shared with authorised ILO personnel. Do not include passwords or unnecessary sensitive personal information.</p><form id="f"><div class="grid"><div><label for="rating">Overall attachment experience (1–5)</label><select id="rating" required><option value="">Choose rating</option><option value="1">1 – Very poor</option><option value="2">2 – Poor</option><option value="3">3 – Fair</option><option value="4">4 – Good</option><option value="5">5 – Excellent</option></select></div><div><label for="relevance">Is the training relevant to your course?</label><select id="relevance"><option value="">Choose</option><option>Yes</option><option>Partly</option><option>No</option></select></div><div><label for="supervision">Are you receiving supervision?</label><select id="supervision"><option value="">Choose</option><option>Regularly</option><option>Sometimes</option><option>Not at all</option></select></div><div><label for="safety">Are the working conditions safe?</label><select id="safety"><option value="">Choose</option><option>Yes</option><option>Some concerns</option><option>No</option></select></div></div><label for="challenge">Challenges or support needed</label><textarea id="challenge" maxlength="1200" placeholder="Describe any challenges you are experiencing"></textarea><label for="comment">Additional feedback</label><textarea id="comment" maxlength="2000" placeholder="Your comments or suggestions"></textarea><label style="display:flex;gap:9px;align-items:center;margin:12px 0"><input id="urgent" type="checkbox" style="width:auto"> This is an urgent concern requiring prompt follow-up</label><div id="msg" role="status"></div><button id="send">Submit feedback</button></form></section><section class="card"><h2>My previous feedback</h2><div id="history">'+(list.length?list.map(rowStudent).join(''):'<p class="muted">You have not submitted feedback yet.</p>')+'</div></section>';document.getElementById('f').onsubmit=async function(e){e.preventDefault();var b=document.getElementById('send');b.disabled=true;try{await api('feedback',{method:'POST',body:JSON.stringify({rating:Number(document.getElementById('rating').value),relevance:document.getElementById('relevance').value,supervision:document.getElementById('supervision').value,safety:document.getElementById('safety').value,challenge:document.getElementById('challenge').value,comment:document.getElementById('comment').value,urgent:document.getElementById('urgent').checked})});msg('Your feedback has been submitted. Thank you.','ok');setTimeout(start,700)}catch(x){msg(x.message,'err')}finally{b.disabled=false}}}
function rowStudent(x){return '<article class="item"><span class="pill">'+esc(status(x.status))+'</span> '+(x.urgent?'<span class="urgent">Urgent</span>':'')+'<div class="muted">'+new Date(x.submittedAt).toLocaleString()+' · Rating '+esc(x.rating)+'/5</div><p><b>Training:</b> '+esc(x.relevance)+' · <b>Supervision:</b> '+esc(x.supervision)+' · <b>Safety:</b> '+esc(x.safety)+'</p><p>'+esc(x.challenge||x.comment||'No additional comments')+'</p>'+(x.history||[]).map(h=>'<p class="muted">'+esc(status(h.status))+' · '+esc(h.note)+' · '+new Date(h.at).toLocaleString()+'</p>').join('')+'</article>'}
function renderStaff(list){app.innerHTML='<section class="card"><h2>Student feedback register</h2><p class="muted">Only feedback within your authorised department or leadership scope is shown.</p><div id="msg" role="status"></div><div id="rows">'+(list.length?list.map(rowStaff).join(''):'<p class="muted">No student feedback has been submitted.</p>')+'</div></section>';document.querySelectorAll('[data-save]').forEach(function(b){b.onclick=async function(){var id=b.dataset.save,sel=document.querySelector('[data-status="'+id+'"]'),note=document.querySelector('[data-note="'+id+'"]');b.disabled=true;try{await api('feedback/triage',{method:'POST',body:JSON.stringify({id:id,status:sel.value,note:note.value})});msg('Feedback status updated.','ok');setTimeout(start,500)}catch(e){msg(e.message,'err')}finally{b.disabled=false}}})}
function rowStaff(x){return '<article class="item"><b>'+esc(x.name)+'</b> · '+esc(x.adm)+' <span class="pill">'+esc(status(x.status))+'</span> '+(x.urgent?'<span class="urgent">URGENT</span>':'')+'<div class="muted">'+esc(x.dept)+' · '+esc(x.course)+' · '+new Date(x.submittedAt).toLocaleString()+'</div><p><b>Organisation:</b> '+esc(x.org||'Not recorded')+' · <b>Rating:</b> '+esc(x.rating)+'/5</p><p><b>Course relevance:</b> '+esc(x.relevance)+' · <b>Supervision:</b> '+esc(x.supervision)+' · <b>Safety:</b> '+esc(x.safety)+'</p><p><b>Challenges:</b> '+esc(x.challenge||'None stated')+'</p><p><b>Additional comments:</b> '+esc(x.comment||'None')+'</p><div class="grid"><div><label>Status</label><select data-status="'+esc(x.id)+'"><option value="new" '+(x.status==='new'?'selected':'')+'>New</option><option value="in_progress" '+(x.status==='in_progress'?'selected':'')+'>In progress</option><option value="referred" '+(x.status==='referred'?'selected':'')+'>Referred</option><option value="resolved" '+(x.status==='resolved'?'selected':'')+'>Resolved</option></select></div><div><label>Follow-up note</label><input data-note="'+esc(x.id)+'" placeholder="Action taken / follow-up"></div></div><button data-save="'+esc(x.id)+'" style="margin-top:10px">Save follow-up</button></article>'}
start();})();
</script></body></html>
